<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Infinite Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8">

    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full space-y-6">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-slate-900">Admin Login</h2>
                <p class="text-slate-500 text-sm">Please enter the dashboard password</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="admin-password"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none"
                    placeholder="Password">
                <button id="login-btn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors">
                    Login
                </button>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="admin-dashboard" class="hidden max-w-6xl mx-auto space-y-8">

        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
                <h1 class="text-2xl font-black text-slate-900">Dashboard</h1>
                <p class="text-slate-500 text-sm">Infinite Master System Management</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="location.reload()" class="bg-white hover:bg-slate-50 border border-slate-200 px-6 py-2 rounded-xl font-semibold text-sm transition-colors shadow-sm">
                    Refresh
                </button>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Total Plays</p>
                <p class="text-3xl font-black text-slate-900" id="total-plays">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Correct</p>
                <p class="text-3xl font-black text-emerald-600" id="total-correct">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Incorrect</p>
                <p class="text-3xl font-black text-rose-500" id="total-incorrect">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Active Sessions</p>
                <p class="text-3xl font-black text-indigo-600" id="active-sessions">0</p>
            </div>
        </div>

        <!-- Ad Configuration -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50">
                <h2 class="font-bold text-slate-700">Ad Configuration</h2>
            </div>
            <div class="p-6">
                <div class="flex gap-4">
                    <input type="text" id="sponsor-url"
                        class="flex-grow bg-slate-100 border-none px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                        placeholder="https://sponsor-ad-url.com">
                    <button id="save-config-btn"
                        class="bg-white hover:bg-slate-900 hover:text-white border-2 border-slate-900 px-8 py-3 rounded-xl font-bold transition-all">
                        Save URL
                    </button>
                </div>
            </div>
        </section>

        <!-- Rankings & Emails Combined -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50">
                <h2 class="font-bold text-slate-700">Rankings & Registered Emails</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-slate-400 text-xs font-bold uppercase tracking-widest">
                        <tr>
                            <th class="px-6 py-4">Rank</th>
                            <th class="px-6 py-4">Nickname</th>
                            <th class="px-6 py-4 text-indigo-600">Score</th>
                            <th class="px-6 py-4">Email</th>
                            <th class="px-6 py-4">Date</th>
                            <th class="px-6 py-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-tbody" class="divide-y divide-slate-100">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </section>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Dummy Entry -->
            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50">
                    <h2 class="font-bold text-slate-700">Manual Entry (Test)</h2>
                </div>
                <div class="p-6 space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="dummy-nickname" placeholder="Nickname" class="bg-slate-100 border-none px-4 py-3 rounded-xl outline-none">
                        <input type="number" id="dummy-score" placeholder="Score" class="bg-white border-2 border-slate-100 px-4 py-3 rounded-xl outline-none">
                    </div>
                    <button id="add-dummy-btn" class="w-full bg-white hover:bg-slate-900 hover:text-white border-2 border-slate-900 py-3 rounded-xl font-bold transition-all">
                        Add Entry
                    </button>
                </div>
            </section>

            <!-- Recent History -->
            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 text-slate-700 font-bold">
                    Recent History
                </div>
                <div class="max-h-[300px] overflow-y-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold tracking-widest">
                            <tr>
                                <th class="px-6 py-3">ID</th>
                                <th class="px-6 py-3">Score</th>
                                <th class="px-6 py-3">Date</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody" class="divide-y divide-slate-50">
                            <!-- Rows -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>

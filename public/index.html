<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無限マスターへの道</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>無限マスターへの道</h1>
            <p>次々と現れる絵文字の中から正解を見つけ出し、無限の連勝を目指せ！</p>
            <p class="warning">※不正解時はゲームオーバーとなり、スポンサー広告が表示されます</p>
            <button id="start-btn">ゲーム開始</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <h1>無限マスターへの道</h1>
            <div class="status">
                現在の連勝数: <span id="win-count">0</span>
            </div>
            <div class="quiz-container">
                <p id="quiz-instruction">選んでください。</p>
                <div id="choices-container" class="choices">
                    <!-- Dynamic buttons -->
                </div>
            </div>
            <p class="small-warning">※不正解時はゲームオーバーとなり、スポンサー広告が表示されます</p>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1>ゲームオーバー...</h1>
            <p>最終スコア: <span id="final-score">0</span></p>
            <div id="token-display" class="hidden">
                <p>トップランカー識別トークン:</p>
                <code id="rank-token"></code>
            </div>
            <div id="ad-trigger" class="ad-trigger">
                ここをクリックして再挑戦
            </div>
        </div>

        <!-- Rankings Screen -->
        <div id="rankings-container" class="ranking-section">
            <h2>ランキング</h2>
            <ul id="rankings-list"></ul>
        </div>

        <!-- Block Warning Modal -->
        <div id="block-modal" class="modal hidden">
            <div class="modal-content">
                <h2>環境チェック</h2>
                <p id="block-message"></p>
                <div class="modal-actions">
                    <button id="modal-continue">続行</button>
                    <button id="modal-howto">設定方法を見る</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AdBlock Bait -->
    <div id="ad-bait" class="ad-bait ads-banner" style="position: absolute; left: -9999px;">&nbsp;</div>

    <script src="ads.js"></script>
    <script src="script.js"></script>
</body>
</html>
